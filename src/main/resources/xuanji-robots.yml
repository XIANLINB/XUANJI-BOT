# 璇玑框架 - 机器人配置文件
#
# 在此配置机器人的凭证、环境和连接方式
# 框架启动时会自动读取此文件，注册并连接所有启用的机器人
#
# 全局配置：
#   webhook-url:      使用 Webhook 方式时必须配置域名，完整回调地址为 https://{webhook-url}/webhook/{app-id}
#   is-new-openbot:   是否使用新开放平台（true=新平台 api.bot.qq.com，false=老平台 api.sgroup.qq.com）
#
# 机器人配置：
#   app-id:           QQ 开放平台申请的 AppID
#   client-secret:    QQ 开放平台申请的 AppSecret（明文，框架会自动加密存储）
#   is-sandbox:       是否使用沙箱环境（true=沙箱，false=正式环境）
#   connection-method: 连接方式（websocket=WebSocket 方式，webhook=Webhook 方式）
#
# intents 说明（仅 WebSocket 模式有效）：
#   通过位运算组合订阅事件，不填则使用默认值
#   GUILDS              = 1 << 0   // 频道事件
#   GUILD_MEMBERS       = 1 << 1   // 成员变动
#   DIRECT_MESSAGE      = 1 << 12  // 私信消息
#   INTERACTION         = 1 << 26  // 互动事件（按钮点击等）
#   GROUP_AT_MESSAGE    = 1 << 25  // 群 @消息
#   C2C_MESSAGE         = 1 << 25  // 单聊消息
#   FORUMS              = 1 << 28  // 论坛事件
#   AUDIO_ACTION        = 1 << 29  // 音频事件
#   PUBLIC_GUILD_MESSAGES = 1 << 30 // 频道公开消息
#
# QQ 开放平台地址说明：
#   老版本正式环境: https://api.sgroup.qq.com
#   老版本沙箱环境: https://sandbox.api.sgroup.qq.com
#   新版本统一地址: https://api.bot.qq.com
#   获取 Token 地址（新）: https://api.bot.qq.com/app/getAppAccessToken
#
# 示例配置：

xuanji:
  # 全局配置
  webhook-url: "xuanji.icu"
  is-new-openbot: true
  ignore-bot-messages: false  # true=忽略机器人发送的消息，false=正常处理所有消息

  robots:
    bot1:
      app-id: "1905134745"
      client-secret: "M6qbN9wkYND4vnfYRLGB730ywvuuvwy1"
      is-sandbox: false
      connection-method: websocket
