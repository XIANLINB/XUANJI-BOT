<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>璇玑控制台</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f5;color:#333}.header{background:#1a1a2e;color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}.header-left{display:flex;align-items:center;gap:16px}.header h1{margin:0;font-size:20px}.header span{opacity:.7;font-size:13px}.header-right{display:flex;gap:8px}.nav{display:flex;background:#16213e;padding:0 24px}.nav a{color:#a0b4d0;text-decoration:none;padding:12px 18px;font-size:14px;border-bottom:2px solid transparent}.nav a.active,.nav a:hover{color:#fff;border-bottom-color:#4fc3f7}.main{padding:20px;max-width:1200px;margin:0 auto}.card{background:#fff;border-radius:8px;padding:16px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.card h3{margin:0 0 10px;font-size:15px;color:#1a1a2e}.row{display:flex;gap:14px;flex-wrap:wrap}.stat{flex:1;min-width:140px;background:linear-gradient(135deg,#e8f0fe,#d4e4fc);border-radius:8px;padding:14px;text-align:center}.stat .num{font-size:24px;font-weight:700;color:#1a56db}.stat .label{font-size:12px;color:#666;margin-top:3px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #eee}th{background:#f8f9fa;font-weight:600}.log-box{background:#1a1a2e;color:#4fc3f7;padding:12px;border-radius:6px;font-size:12px;max-height:400px;overflow-y:auto;overflow-x:hidden;white-space:pre-wrap;margin:0;font-family:monospace}.log-line{padding:1px 0}.log-line.error{color:#ff6b6b}.log-line.warn{color:#ffd93d}button,input,select{padding:7px 12px;border:1px solid #ccc;border-radius:5px;font-size:13px;margin:2px 4px 2px 0;cursor:pointer}.btn-primary{background:#1a56db;color:#fff;border:none}.btn-danger{background:#dc3545;color:#fff;border:none}.btn-warn{background:#f0ad4e;color:#fff;border:none}.btn-sm{padding:3px 8px;font-size:12px}.btn-xs{padding:2px 6px;font-size:11px}.hidden{display:none}.msg{margin-top:8px;padding:8px;border-radius:5px;font-size:13px}.msg.ok{background:#d4edda;color:#155724}.msg.err{background:#f8d7da;color:#721c24}.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.log-info{font-size:11px;color:#999;margin-left:8px}.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px;background:#e8f0fe;color:#1a56db;margin:0 4px}.toast{position:fixed;top:16px;right:16px;padding:10px 16px;border-radius:6px;font-size:13px;z-index:999;animation:fadein .3s}.toast-ok{background:#d4edda;color:#155724}.toast-err{background:#f8d7da;color:#721c24}@keyframes fadein{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}</style></head>
<body>
<div class="header">
<div class="header-left"><h1>璇玑控制台</h1><span>Xuanji Bot Console v0.1</span></div>
<div class="header-right"><button class="btn-warn btn-sm" onclick="clearCache()" title="清除浏览器缓存: localStorage + sessionStorage + caches">🗑 清空缓存</button></div>
</div>
<div class="nav"><a href="#" class="active" data-tab="dash">仪表盘</a><a href="#" data-tab="db">数据库</a><a href="#" data-tab="perm">权限</a><a href="#" data-tab="monitor">实时监控</a><a href="#" data-tab="sys">系统</a></div>
<div class="main" id="main"></div>
<div id="toast"></div>

<script>
const A='/xuanji/api';

function toast(msg,ok){let e=document.getElementById('toast');e.className='toast toast-'+(ok?'ok':'err');e.textContent=msg;setTimeout(()=>e.textContent='',2500)}

function clearCache(){
try{localStorage.clear();sessionStorage.clear();
if('caches' in window){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}
toast('缓存已清空',true);setTimeout(()=>location.reload(),500)
}catch(e){toast('清空失败: '+e.message,false)}
}

async function get(u){let r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()}
function dash(){return`<div class="row" id="stat-row"></div><div class="card"><h3>数据库</h3><table id="dash-tables"><tr><td>加载中...</td></tr></table></div>`}
function db(){return`<div class="card"><h3>数据表</h3><table><thead><tr><th>表名</th><th>操作</th></tr></thead><tbody id="tables-body"></tbody></table></div><div id="schema-view" class="hidden card"><h3 id="schema-title"></h3><table><thead><tr><th>列名</th><th>类型</th><th>可空</th></tr></thead><tbody id="schema-body"></tbody></table></div>`}
function perm(){return`
<div class="card"><h3>群超管</h3><div class="flex"><input id="sa-bot" placeholder="botKey"><input id="sa-grp" placeholder="groupId"><input id="sa-uid" placeholder="memberOpenid"><button class="btn-primary" onclick="addSA()">添加</button></div><table><thead><tr><th>Bot</th><th>群</th><th>成员</th><th>操作</th></tr></thead><tbody id="sa-body"></tbody></table></div>
<div class="card"><h3>黑名单</h3><div class="flex"><input id="bl-scope" placeholder="scope(如 bot:bot1)"><input id="bl-tid" placeholder="memberOpenid"><button class="btn-danger" onclick="addBL()">添加</button></div><table><thead><tr><th>ID</th><th>范围</th><th>目标</th><th>原因</th><th>时间</th><th>操作</th></tr></thead><tbody id="bl-body"></tbody></table></div>`}
function monitor(){return`
<div class="card">
<div class="toolbar"><h3 style="margin:0">运行日志</h3>
<div><label><input type="checkbox" id="auto-scroll" checked>自动滚动</label>
<label style="margin-left:10px">行数:<input id="log-lines" value="200" style="width:60px;padding:4px 6px;margin:0 2px"></label>
<button class="btn-primary btn-sm" onclick="loadLogs()">刷新</button>
<button class="btn-sm" onclick="clearLogView()">清空显示</button></div></div>
<div class="log-box" id="log-box"><div class="log-line">点击刷新查看日志...</div></div>
<span class="log-info" id="log-info"></span>
</div>`}
function sys(){return`<div class="card"><div id="sys-info">加载中...</div></div>`}

const tabs={dash,db,perm,monitor,sys};let active='dash',timer;
document.querySelectorAll('.nav a').forEach(a=>a.onclick=e=>{e.preventDefault();switchTab(a.dataset.tab)});
function switchTab(t){active=t;document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('active'));document.querySelector(`[data-tab="${t}"]`).classList.add('active');clearInterval(timer);render()}

async function render(){
document.getElementById('main').innerHTML=tabs[active]();
if(active==='dash'){await loadDash();timer=setInterval(loadDash,5000)}
if(active==='db')await loadTables();
if(active==='perm'){await loadSA();await loadBL()}
if(active==='monitor'){await loadLogs();timer=setInterval(loadLogs,3000)}
if(active==='sys')await loadSys()
}

async function loadDash(){
try{let d=await get(A+'/console/status');document.getElementById('stat-row').innerHTML=
`<div class="stat"><div class="num">1</div><div class="label">Bot 在线</div></div>
<div class="stat"><div class="num">${d.tables}</div><div class="label">数据表</div></div>
<div class="stat"><div class="num">${d.uptime}</div><div class="label">运行时间</div></div>
<div class="stat"><div class="num">${d.memUsed}</div><div class="label">已用内存</div></div>`
let tl=await get(A+'/db/tables');document.getElementById('dash-tables').innerHTML=tl.map(r=>`<tr><td>${r.TABLE_NAME}</td></tr>`).join('')
}catch(e){}
}

async function loadTables(){
let data=await get(A+'/db/tables');
document.getElementById('tables-body').innerHTML=data.map(r=>`<tr><td>${r.TABLE_NAME}</td><td><button class="btn-sm btn-primary" onclick="showSchema('${r.TABLE_NAME}')">结构</button></td></tr>`).join('');
}
async function showSchema(t){
try{
let data=await get(A+'/db/schema?table='+t);
document.getElementById('schema-title').textContent=t;
document.getElementById('schema-body').innerHTML=data.map(r=>`<tr><td>${r.COLUMN_NAME}</td><td>${r.TYPE_NAME}</td><td>${r.IS_NULLABLE}</td></tr>`).join('');
document.getElementById('schema-view').classList.remove('hidden')
}catch(e){toast('查询表结构失败: '+e.message,false)}
}

async function loadSA(){let data=await get(A+'/console/super-admins');document.getElementById('sa-body').innerHTML=data.map(r=>`<tr><td>${r.BOT_KEY}</td><td>${r.GROUP_ID}</td><td>${r.MEMBER_OPENID}</td><td><button class="btn-sm btn-danger" onclick="delSA('${r.BOT_KEY}','${r.GROUP_ID}','${r.MEMBER_OPENID}')">删除</button></td></tr>`).join('')}
async function addSA(){await fetch(A+'/permission/super-admin/add?botKey='+v('sa-bot')+'&groupId='+v('sa-grp')+'&memberOpenid='+v('sa-uid'),{method:'POST'});loadSA()}
async function delSA(b,g,u){await fetch(A+'/console/super-admin?botKey='+b+'&groupId='+g+'&memberOpenid='+u,{method:'DELETE'});loadSA()}
async function loadBL(){let data=await get(A+'/console/blacklists');document.getElementById('bl-body').innerHTML=data.map(r=>`<tr><td>${r.ID}</td><td>${r.SCOPE}</td><td>${r.TARGET_ID}</td><td>${r.REASON||''}</td><td>${r.CREATED_AT}</td><td><button class="btn-sm btn-danger" onclick="delBL(${r.ID})">删除</button></td></tr>`).join('')}
async function addBL(){await fetch(A+'/permission/blacklist/add?scope='+v('bl-scope')+'&targetType=user&targetId='+v('bl-tid')+'&reason=控制台操作',{method:'POST'});loadBL()}
async function delBL(id){await fetch(A+'/console/blacklist?id='+id,{method:'DELETE'});loadBL()}

function clearLogView(){let b=document.getElementById('log-box');if(b)b.innerHTML='<div class="log-line">-- 显示已清空 --</div>'}

async function loadLogs(){
try{
let lines=v('log-lines')||'200';
let r=await fetch(A+'/console/logs?lines='+lines);let t=await r.text();
let arr=t.split('\n');let box=document.getElementById('log-box');
if(!box)return;
let autoCheck=document.getElementById('auto-scroll');
let wasAtBottom=autoCheck&&autoCheck.checked;

// 限制 DOM 行数: 超过 500 行时只保留后 500 行
box.innerHTML=arr.slice(-500).map(l=>`<div class="log-line${l.match(/ERROR|WARN/)&&!l.includes('[DB]')?' '+(l.includes('ERROR')?'error':'warn'):''}">${esc(l)}</div>`).join('');
if(wasAtBottom)box.scrollTop=box.scrollHeight;

// 显示日志大小信息
let si=document.getElementById('log-info');
if(si)si.textContent='显示 '+arr.length+' 行 | 文件共 '+t.length.toLocaleString()+' 字节';
}catch(e){let b=document.getElementById('log-box');if(b)b.innerHTML='<div class="log-line error">日志读取失败: '+e.message+'</div>'}
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

async function loadSys(){
let d=await get(A+'/console/status');
document.getElementById('sys-info').innerHTML=`<table>
<tr><td>启动时间</td><td>${d.startTime}</td></tr>
<tr><td>运行时长</td><td>${d.uptime}</td></tr>
<tr><td>数据表数</td><td>${d.tables}</td></tr>
<tr><td>内存使用</td><td>${d.memUsed}</td></tr>
<tr><td>数据路径</td><td>${d.dbPath}</td></tr>
<tr><td>框架</td><td>Xuanji v1.0.0-SNAPSHOT / SB 4.0.6 / JDK 25</td></tr></table>`}

function v(id){return document.getElementById(id).value}
render();
</script></body></html>
