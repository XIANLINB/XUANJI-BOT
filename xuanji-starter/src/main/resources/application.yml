# 璇玑 QQ 机器人开发框架

server:
  port: 8668

spring:
  application:
    name: xuanji-bot

  # 内嵌 H2 数据库（零配置）
  datasource:
    url: jdbc:h2:file:./data/xuanji/data/xuanji;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

# 日志
logging:
  level:
    dev.xuanji: DEBUG
    root: INFO

# 璇玑框架配置
xuanji:
  master: ""   # 机器人主人 QQ 号，设置后获得 L0 最高权限
