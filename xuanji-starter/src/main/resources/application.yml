# 璇玑 QQ 机器人开发框架

server:
  port: 8668

spring:
  application:
    name: xuanji-bot

  # 内嵌 H2 数据库（零配置）
  datasource:
    url: jdbc:h2:file:./data/xuanji/data/xuanji;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

# 日志
logging:
  level:
    dev.xuanji: DEBUG
    root: INFO

# 璇玑框架配置
xuanji:
  # 机器人主人（按 botKey 配置 member_openid）
  # 同一人在不同 bot 里 openid 不同，需分别填写
  master:
    bot1: ""   # Bot1 的主人 member_openid（从群聊日志 member= 字段获取）
