# 璇玑 QQ 机器人开发框架

server:
  port: 8668

spring:
  application:
    name: xuanji-bot

  # 定时任务调度线程池（@Scheduled 任务并行执行，避免单个任务卡住阻塞其它任务）
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: xuanji-sched-

  # 业务库（零配置，data/xuanji/data/xuanji.mv.db）
  datasource:
    url: jdbc:h2:file:./data/xuanji/data/xuanji;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 3

# 日志
logging:
  file:
    name: logs/xuanji-bot.log
  level:
    dev.xuanji: DEBUG
    root: INFO

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    export:
      simple:
        enabled: true

# 璇玑框架配置
xuanji:
  # 机器人主人（按 botKey 配置 member_openid）
  master:
    bot1: ""
    bot2: ""

  # 日志库（独立 H2 文件，data/xuanji/xuanji.log.mv.db）
  log-datasource:
    url: jdbc:h2:file:./data/xuanji/xuanji.log;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # ==================== OneBot v11 适配器 ====================
  # 只认 OneBot v11 标准协议，兼容 Napcat / Lagrange / go-cqhttp 等任意实现。
  # enabled=false 时整个模块不装配（不开端点、不建 Bean）。
  onebot:
    enabled: true
    # API 调用超时（毫秒）
    api-timeout-ms: 10000
    # 忽略 bot 自身发出的消息回显
    ignore-self-message: true

    # 反向 WS（推荐）：框架作服务端，OneBot 实现主动连过来
    # Napcat 侧配置 ws-reverse.universal = ws://框架IP:8668/onebot/ws
    reverse:
      enabled: true
      path: /onebot/ws
      # 强烈建议配置，留空则任何人可连；用环境变量注入，勿写死在文件里
      access-token: ${ONEBOT_TOKEN:}

    # 正向 WS：框架作客户端，主动连 OneBot 实现的 WS 端口
    forward:
      enabled: false
      url: ws://127.0.0.1:3001
      access-token: ${ONEBOT_TOKEN:}
      reconnect-interval-ms: 5000
