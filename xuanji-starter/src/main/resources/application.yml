# 璇玑 QQ 机器人开发框架

server:
  port: 8668

spring:
  application:
    name: xuanji-bot

  # 内嵌 H2 数据库（零配置，data/xuanji.mv.db）
  datasource:
    url: jdbc:h2:file:./data/xuanji;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

# 日志
logging:
  level:
    dev.xuanji: DEBUG
    root: INFO
