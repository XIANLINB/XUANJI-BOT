# 璇玑 QQ 机器人开发框架

server:
  port: 8668

spring:
  application:
    name: xuanji-bot

  # 业务库（零配置，data/xuanji/data/xuanji.mv.db）
  datasource:
    url: jdbc:h2:file:./data/xuanji/data/xuanji;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 3

# 日志
logging:
  file:
    name: logs/xuanji-bot.log
  level:
    dev.xuanji: DEBUG
    root: INFO

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  metrics:
    export:
      simple:
        enabled: true

# 璇玑框架配置
xuanji:
  # 机器人主人（按 botKey 配置 member_openid）
  master:
    bot1: ""
    bot2: ""

  # 日志库（独立 H2 文件，data/xuanji/xuanji.log.mv.db）
  log-datasource:
    url: jdbc:h2:file:./data/xuanji/xuanji.log;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
